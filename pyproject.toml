[project]
name = "promo-catalog"
version = "0.0.1"
description = "Catalog generator for for-promotional-use-only.com"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "orjson>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promo_catalog"]

[dependency-groups]
dev = []
